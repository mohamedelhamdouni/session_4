<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- تدرج الألوان للأيقونة باللون الأحمر -->
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="50%" stop-color="#e60000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
  </defs>
  
  <!-- أيقونة سلة التسوق باللون الأحمر (بدون خلفية) -->
  <g transform="translate(20, 10) scale(1.6)">
    <!-- العجلات -->
    <circle cx="16" cy="38" r="3" fill="url(#redGradient)" />
    <circle cx="34" cy="38" r="3" fill="url(#redGradient)" />
    
    <!-- هيكل السلة -->
    <path d="M 4.5 12 L 10 12 L 15 28 L 38 28 L 43 16 L 14 16" fill="none" stroke="url(#redGradient)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- مقبض السلة -->
    <path d="M 2 6 L 6 6 L 10 12" fill="none" stroke="url(#redGradient)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
        
  <!-- نص mshop أسفل الأيقونة باللون الأحمر -->
  <text x="60" y="112" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#e60000" text-anchor="middle">mshop</text>
</svg>